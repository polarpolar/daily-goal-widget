<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 核心：适配移动端视口，禁止缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iOS 全屏关键配置：隐藏Safari地址栏/工具栏 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- iOS 状态栏样式：半透明黑色，适配深色模式 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 应用名称（添加到桌面时显示） -->
  <meta name="apple-mobile-web-app-title" content="今日目标">
  <!-- 网页标题 -->
  <title>今日目标</title>
  <style>
    /* 全局重置：消除默认边距，确保全屏 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 页面主体：深色模式+全屏高度+适配安全区 */
    body {
      min-height: 100vh;
      background-color: #121212; /* 深色模式主背景 */
      color: #ffffff; /* 文字白色 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      /* 适配iPhone刘海/底部安全区，避免内容被遮挡 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      /* 文字居中，提升移动端体验 */
      text-align: center;
      line-height: 1.6;
    }

    /* 容器：限制最大宽度，居中显示 */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 标题样式：加大字号，增加间距 */
    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #f5f5f5;
    }

    /* 目标列表样式：适配移动端 */
    .goal-list {
      list-style: none;
      margin-top: 20px;
    }

    .goal-item {
      background-color: #1e1e1e;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    /* 适配小屏手机 */
    @media (max-width: 375px) {
      h1 {
        font-size: 1.8rem;
      }
      .goal-item {
        font-size: 1rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>今日目标</h1>
    <!-- 示例目标列表，你可以根据需要修改/增删 -->
    <ul class="goal-list">
      <li class="goal-item">完成代码优化，适配iOS全屏</li>
      <li class="goal-item">把应用添加到手机桌面</li>
      <li class="goal-item">测试深色模式显示效果</li>
    </ul>
  </div>

  <script>
    // 可选：检测系统深色模式，自动匹配（如果需要）
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.style.backgroundColor = "#121212";
      document.body.style.color = "#ffffff";
    }

    // 可选：禁止页面缩放（增强App体验）
    document.addEventListener('touchmove', function (event) {
      if (event.scale !== 1) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
