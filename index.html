<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>每日目标小工具</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    padding: 0;
    margin: 0;
    min-height: 100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  /* 核心修复1：初始化根元素默认样式，解决首次打开颜色渲染错误 */
  :root {
    --bg-main: #fff;
    --bg-input: #fafafa;
    --bg-show: #f5f5f5;
    --bg-btn: #f8f8f8;
    --text-main: #222;
    --border-main: #ddd;
    --primary-color: #007AFF;
  }
  :root.dark {
    --bg-main: #1c1c1e;
    --bg-input: #2c2c2e;
    --bg-show: #2c2c2e;
    --bg-btn: #2c2c2e;
    --text-main: #fff;
    --border-main: #444;
    --primary-color: #007AFF;
  }
  :root.light {
    --bg-main: #fff;
    --bg-input: #fafafa;
    --bg-show: #f5f5f5;
    --bg-btn: #f8f8f8;
    --text-main: #222;
    --border-main: #ddd;
    --primary-color: #007AFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light):not(.dark) {
      --bg-main: #1c1c1e;
      --bg-input: #2c2c2e;
      --bg-show: #2c2c2e;
      --bg-btn: #2c2c2e;
      --text-main: #fff;
      --border-main: #444;
      --primary-color: #007AFF;
    }
  }
  body{
    background:var(--bg-main);
    color:var(--text-main);
  }
  .container {
    max-width:500px;
    margin:0 auto;
    /* 核心修复2：增加顶部内边距，避免iOS上按钮与文本框重叠 */
    padding: 50px 14px 14px;
    min-height: 100vh;
    background: var(--bg-main);
  }
  .box{margin-bottom:20px;}
  h4{font-size:18px;margin:0 0 10px 0;display:flex;align-items:center;gap:6px;}
  h4 svg{width:18px;height:18px;}
  input,textarea{
    width:100%;
    padding:12px;
    border:1px solid var(--border-main);
    border-radius:12px;
    font-size:16px;
    background:var(--bg-input);
    color:var(--text-main);
    margin-bottom:10px;
    -webkit-appearance: none;
    appearance: none;
  }
  textarea{resize:none;height:100px;line-height:1.5;}
  button{
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--primary-color);
    color:white;
    font-size:16px;
    cursor:pointer;
    margin:4px 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn-row{display:flex;gap:8px;margin:8px 0;}
  .btn-row button{flex:1;}
  .btn-secondary{background:var(--bg-btn);color:var(--text-main);border:1px solid var(--border-main);}
  .show{padding:12px;background:var(--bg-show);border-radius:12px;margin-top:10px;font-size:16px;min-height:48px;white-space:pre-wrap;line-height:1.5;}
  .status-row{display:flex;gap:10px;margin:10px 0;}
  .status-btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border-main);background:var(--bg-btn);color:var(--text-main);font-size:16px;}
  .status-btn.active{background:var(--primary-color);color:white;border-color:var(--primary-color);}
  .mode-toggle{
    position:fixed;
    top:14px;
    right:14px;
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
    z-index: 999;
    /* 优化按钮样式，增强可读性 */
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  /* 历史记录页面样式优化 */
  .history-page html, .history-page body {
    padding:0;
    margin:0;
    min-height:100vh;
  }
  .history-page .container {
    max-width:500px;
    margin:0 auto;
    padding: 14px;
    min-height: 100vh;
    background:var(--bg-main);
  }
  /* 返回按钮样式 */
  .back-btn {
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-btn);
    color: var(--text-main);
    border: 1px solid var(--border-main);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <button class="mode-toggle btn-secondary" onclick="toggleDarkMode()">切换深色模式</button>

  <div class="box">
    <h4>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      今日目标
    </h4>
    <input id="goal" placeholder="今天最重要的1件事">
    <button onclick="saveGoal()">保存目标</button>
    <div id="showGoal" class="show">未填写</div>
  </div>

  <div class="box">
    <h4>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      今日结果
    </h4>
    <div class="status-row">
      <button class="status-btn" id="s1" onclick="setStatus(1)">完成</button>
      <button class="status-btn" id="s0" onclick="setStatus(0)">未完成</button>
    </div>
  </div>

  <div class="box">
    <h4 id="resultTitle">完成情况</h4>
    <textarea id="result" placeholder="请填写完成细节/未完成原因与分析..."></textarea>
    <button onclick="saveResult()">保存内容</button>
    <div id="showResult" class="show">未填写</div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="openHistoryPage()">查看历史记录</button>
    </div>
  </div>
</div>

<script>
function toggleDarkMode() {
  const root = document.documentElement;
  if (root.classList.contains('dark')) {
    root.classList.remove('dark');
    root.classList.add('light');
    localStorage.setItem('darkMode', 'light');
  } else {
    root.classList.remove('light');
    root.classList.add('dark');
    localStorage.setItem('darkMode', 'dark');
  }
}

function initDarkMode() {
  const savedMode = localStorage.getItem('darkMode');
  const root = document.documentElement;
  // 核心修复：确保初始化时必有样式类，解决渲染错误
  if (savedMode === 'dark') {
    root.classList.add('dark');
    root.classList.remove('light');
  } else if (savedMode === 'light') {
    root.classList.add('light');
    root.classList.remove('dark');
  } else {
    // 无保存状态时，根据系统偏好设置默认类
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.classList.add('dark');
    } else {
      root.classList.add('light');
    }
  }
}

function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function setStatus(status) {
  localStorage.setItem('taskStatus', status);
  renderStatusBtn();
  updateResultTitle();
}

function renderStatusBtn() {
  const status = localStorage.getItem('taskStatus') || '';
  document.getElementById('s1').classList.remove('active');
  document.getElementById('s0').classList.remove('active');
  if (status === '1') document.getElementById('s1').classList.add('active');
  if (status === '0') document.getElementById('s0').classList.add('active');
}

function updateResultTitle() {
  const status = localStorage.getItem('taskStatus') || '';
  const titleDom = document.getElementById('resultTitle');
  titleDom.innerText = status === '1' ? '完成情况' : (status === '0' ? '情况与分析' : '完成情况');
}

function saveGoal() {
  const goalText = document.getElementById('goal').value.trim();
  localStorage.setItem('dailyGoal', goalText);
  saveToHistory();
  showAllContent();
}

function saveResult() {
  const resultText = document.getElementById('result').value.trim();
  localStorage.setItem('dailyResult', resultText);
  saveToHistory();
  showAllContent();
}

function showAllContent() {
  document.getElementById('showGoal').innerText = localStorage.getItem('dailyGoal') || '未填写';
  document.getElementById('showResult').innerText = localStorage.getItem('dailyResult') || '未填写';
}

function saveToHistory() {
  const today = getToday();
  const history = JSON.parse(localStorage.getItem('goalHistory') || '[]');
  const newHistory = history.filter(item => item.date !== today);
  newHistory.push({
    date: today,
    goal: localStorage.getItem('dailyGoal') || '未填写',
    status: localStorage.getItem('taskStatus') || '',
    result: localStorage.getItem('dailyResult') || '未填写'
  });
  localStorage.setItem('goalHistory', JSON.stringify(newHistory));
}

function openHistoryPage() {
  const historyWindow = window.open('', '_blank', 'width=500,height=800');
  if (!historyWindow) {
    alert('请允许弹窗权限，才能查看历史记录');
    return;
  }
  const history = JSON.parse(localStorage.getItem('goalHistory') || '[]');
  history.sort((a, b) => new Date(b.date) - new Date(a.date));
  const savedMode = localStorage.getItem('darkMode');
  const modeClass = savedMode || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  
  let historyHtml = `
<!DOCTYPE html>
<html lang="zh-CN" class="${modeClass} history-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史记录 - 每日目标</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    padding:0;
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  :root.dark {
    --bg-main: #1c1c1e;
    --text-main: #fff;
    --border-main: #444;
    --bg-item: #2c2c2e;
    --bg-btn: #2c2c2e;
    --primary-color: #007AFF;
  }
  :root.light {
    --bg-main: #fff;
    --text-main: #222;
    --border-main: #ddd;
    --bg-item: #f5f5f5;
    --bg-btn: #f8f8f8;
    --primary-color: #007AFF;
  }
  body{background:var(--bg-main);color:var(--text-main);}
  .container {
    max-width:500px;
    margin:0 auto;
    padding:14px;
    min-height:100vh;
    background:var(--bg-main);
  }
  h4{font-size:20px;margin:0 0 20px 0;display:flex;align-items:center;gap:6px;}
  .history-item{padding:12px;background:var(--bg-item);border-radius:12px;margin:8px 0;}
  .history-date{font-weight:bold;margin-bottom:6px;font-size:16px;}
  .history-content{font-size:14px;line-height:1.5;}
  .empty{text-align:center;padding:20px;font-size:16px;color:#888;}
  button{margin-top:20px;padding:10px 16px;border:none;border-radius:8px;background:#007AFF;color:white;font-size:15px;-webkit-appearance: none;appearance: none;}
  .back-btn {
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-btn);
    color: var(--text-main);
    border: 1px solid var(--border-main);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <!-- 新增返回按钮 -->
  <button class="back-btn" onclick="window.close()">← 返回</button>
  <h4>📜 每日目标历史记录</h4>
  ${history.length === 0 ? '<div class="empty">暂无历史记录</div>' : ''}
  ${history.map(item => {
    const statusText = item.status === '1' ? '✅ 完成' : item.status === '0' ? '❌ 未完成' : '🔄 未标记';
    return `
<div class="history-item">
  <div class="history-date">${item.date} ${statusText}</div>
  <div class="history-content">
    目标：${item.goal}<br>
    详情：${item.result}
  </div>
</div>
    `;
  }).join('')}
  <button onclick="if(confirm('确定清空所有历史记录？')){localStorage.removeItem('goalHistory');location.reload();}">清空历史记录</button>
</div>
</body>
</html>
  `;
  historyWindow.document.write(historyHtml);
  historyWindow.document.close();
}

function init() {
  const lastUseDay = localStorage.getItem('lastUseDay') || '';
  const today = getToday();
  if (lastUseDay !== today) {
    localStorage.removeItem('dailyGoal');
    localStorage.removeItem('dailyResult');
    localStorage.removeItem('taskStatus');
    localStorage.setItem('lastUseDay', today);
  }
  // 优先初始化深色模式，再渲染其他内容
  initDarkMode();
  renderStatusBtn();
  updateResultTitle();
  showAllContent();
}

// 回车保存事件
document.getElementById('goal').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') saveGoal();
});
document.getElementById('result').addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    saveResult();
  }
});

window.onload = init;
</script>
</body>
</html>
